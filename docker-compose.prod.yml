# Vela на выделенном сервере: всё своё, наружу ничего не уходит.
#
#   Интернет ──▶ Caddy (80/443, сам выпускает HTTPS) ──▶ web (Next.js :3000)
#                                                          └─ /api и /uploads ─▶ backend (NestJS :4000)
#   backend ──▶ db (PostgreSQL 16) — на этой же машине, в томе vela_pgdata
#   файлы   ──▶ том vela_uploads — на этой же машине
#
# Чем это отличается от прежней схемы: приложение и база жили на Render
# (сервисы vela-web и vela-api, база vela-db), файлы — на его временном диске
# и пропадали при каждом перезапуске. Сервер в США, а персональные данные
# российских пользователей должны храниться в России (152-ФЗ, ст. 18 ч. 5).
# И отдельно: бесплатный тариф Render останавливает сервис после пятнадцати
# минут тишины — первый посетитель ждал около минуты. Теперь всё на своей
# машине, которая не засыпает.
#
# S3_* остались в конфигурации, но по умолчанию пустые: если когда-нибудь
# понадобится вынести файлы в российское объектное хранилище (Yandex Object
# Storage, VK Cloud), достаточно заполнить переменные — код это уже умеет.
#
# Наружу смотрит только Caddy. db, backend и web видны лишь внутри сети.
#
# Запуск на сервере:
#   cp .env.prod.example .env     # и заполнить (см. docs/DEPLOY_DEDICATED.md)
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    # Ровно та же основная версия, что на прежней площадке (проверено
    # подключением к боевой базе 12 августа 2026: PostgreSQL 18.4).
    # Взять младше нельзя: pg_dump 16 отказывается снимать дамп с сервера 18,
    # а восстановить дамп 18 в сервер 16 не даст уже сам psql.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vela}
      POSTGRES_USER: ${POSTGRES_USER:-vela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      # без этого initdb выберет C-локаль, и сортировка кириллицы будет неверной
      LANG: ru_RU.utf8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - vela_pgdata:/var/lib/postgresql/data
    # порт наружу не публикуем: до базы дотягивается только backend по сети compose
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vela} -d ${POSTGRES_DB:-vela}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Адрес базы собирается здесь, а не в .env: пароль и так уже есть в .env,
      # дублировать его во второй строке — лишний повод для рассинхрона.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vela}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vela}?schema=public
    volumes:
      - vela_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    # CMD образа: prisma db push (создаёт схему) → seed → запуск API.

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next печёт NEXT_PUBLIC_* в бандл на сборке — передавать их через
        # environment бесполезно, нужен именно build-arg.
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN:?задайте DOMAIN в .env}
        NEXT_PUBLIC_HERO_MEDIA_URL: ${NEXT_PUBLIC_HERO_MEDIA_URL:-}
        NEXT_PUBLIC_HERO_MEDIA_POSTER: ${NEXT_PUBLIC_HERO_MEDIA_POSTER:-}
        # BUILD_ID задаётся при пересборке, см. docs/DEPLOY_DEDICATED.md, раздел 7
        NEXT_PUBLIC_BUILD_ID: ${BUILD_ID:-dev}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # Next-сервер форвардит браузерные /api и /uploads на backend
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # здесь лежат выпущенные сертификаты
      - caddy_config:/config

volumes:
  vela_pgdata:
  vela_uploads:
  caddy_data:
  caddy_config:
