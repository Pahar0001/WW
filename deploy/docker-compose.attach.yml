# Vela рядом с уже работающим портфолио на одной машине.
#
# Портфолио (проект «sites») держит общий Caddy на портах 80/443 и сеть
# sites_web. Свой Caddy Vela здесь не поднимает — она подключается к тому же
# reverse-proxy: во внешнюю сеть смотрит только vela-web, а Caddy портфолио
# получает новый блок для velatrips.ru (см. deploy/velatrips.Caddyfile).
#
# Образы vela-web и vela-backend собраны заранее на другой машине и загружены
# через docker load — здесь их не собирают: на этом сервере 1 ГБ памяти,
# сборка Next.js его не переживёт и заденет работающий сайт.
#
#   docker compose -f deploy/docker-compose.attach.yml up -d
#
# db и backend видны только во внутренней сети vela_internal; наружу (в общий
# reverse-proxy) выведен один vela-web.

services:
  db:
    image: postgres:18-alpine
    container_name: vela-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vela}
      POSTGRES_USER: ${POSTGRES_USER:-vela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      # ru_RU.utf8 в musl-alpine нет; C.UTF-8 хранит кириллицу без искажений
      # (сортировка побайтовая — приложение и так сортирует по своим полям)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # postgres:18 хранит данные в подкаталоге с номером версии, поэтому том
      # монтируется в /var/lib/postgresql, а не в /var/lib/postgresql/data:
      # старая раскладка роняет контейнер ещё до initdb (см. PR docker-library/postgres#1259)
      - vela_pgdata:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vela} -d ${POSTGRES_DB:-vela}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: vela-backend:amd64
    container_name: vela-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vela}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vela}?schema=public
    volumes:
      - vela_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    image: vela-web:amd64
    container_name: vela-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      # Next форвардит браузерные /api и /uploads на backend внутри сети
      BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN:-velatrips.ru}
    networks:
      internal:     # чтобы дотянуться до backend
      sites_web:    # чтобы общий Caddy дотянулся до web

networks:
  internal:
  sites_web:
    external: true   # сеть проекта портфолио, уже создана

volumes:
  vela_pgdata:
  vela_uploads:
