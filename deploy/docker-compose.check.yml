# Временная надстройка: сайт открывается по IP сервера, пока домен ещё
# смотрит на старую площадку.
#
#   docker compose -f docker-compose.prod.yml -f deploy/docker-compose.check.yml up -d db backend web
#
# Зачем: Caddy не выпустит сертификат, пока A-записи домена не приведут сюда,
# а переключать домен вслепую — значит уронить работающий сайт. Поэтому
# сначала поднимаем всё без Caddy и смотрим на результат по адресу IP:8080.
#
# После переключения DNS этот файл больше не подключаем — deploy/go-live.sh
# поднимает стек без него, и порт 8080 закрывается сам.

services:
  web:
    ports:
      - "8080:3000"
